# Pinned Skia host dependency for the custom renderer.
#
# This is deliberately a source pin rather than a vendored copy. A host fetches
# this exact branch/revision with Skia's DEPS (via depot_tools), then points
# SKIA_ROOT at the checkout. The UI never depends on Skia's internal object
# layout or build products.
repository=https://skia.googlesource.com/skia.git
ref=chrome/m150
revision=9c7b2dffb2433f5a0cc2b77f06025a09126807ed

# Minimum GN args for the CPU-raster off-screen acceptance fixture on macOS.
# Keep GPU/Metal optional until a host supplies a surface integration target.
target_os=mac
target_cpu=arm64
is_official_build=true
is_component_build=false
skia_enable_tools=false
skia_use_gl=false
skia_use_metal=false
skia_use_icu=false
skia_use_harfbuzz=false
skia_use_system_libpng=false
skia_use_libpng_encode=true
skia_use_libpng_decode=false
skia_use_libjpeg_turbo_decode=false
skia_use_libjpeg_turbo_encode=false
skia_use_jpeg_gainmaps=false
skia_use_libwebp_encode=false
skia_use_libwebp_decode=false
skia_use_libavif=false
